<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jobs Matching Game 🌟 Kids English Learning</title>
    <style>
        :root {
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --accent-color: #ff9f43;
            --primary-color: #4ecdc4;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2.2rem;
            color: #2e86de;
            margin: 5px 0 15px 0;
            text-align: center;
            text-shadow: 2px 2px 0px #fff;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 44%;
            z-index: 20;
        }

        .card {
            background: var(--card-bg);
            border: 4px solid #c8d6e5;
            border-radius: 20px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0px #c8d6e5;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
            min-height: 95px;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card.selected {
            border-color: #ff9f43;
            box-shadow: 0 8px 0px #ee5253;
            transform: scale(1.04);
            background-color: #fff9e6;
        }

        /* 角色圖片容器 */
        .avatar-img-container {
            width: 75px;
            height: 75px;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .avatar-img-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 英文單字卡片 */
        .word-card {
            font-size: 1.8rem;
            font-weight: bold;
            color: #222f3e !important;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        /* 連線成功後強制變藍色 */
        .word-card.connected-word {
            color: #0984e3 !important;
        }

        /* 檢查按鈕 */
        .btn-check {
            background: #ff4757;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            box-shadow: 0 9px 0px #c0392b;
            cursor: pointer;
            transition: all 0.1s;
            margin-top: 10px;
            z-index: 20;
        }

        .btn-check:active {
            transform: translateY(5px);
            box-shadow: 0 4px 0px #c0392b;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .card { min-height: 80px; padding: 5px; }
            .avatar-img-container { width: 60px; height: 60px; }
            .word-card { font-size: 1.4rem; }
            .btn-check { font-size: 1.4rem; padding: 14px 30px; }
        }
    </style>
</head>
<body>

    <h1>🌟 Jobs Matching Game 🌟</h1>

    <div class="game-container">
        <canvas id="line-canvas"></canvas>
        <div class="column" id="images-column"></div>
        <div class="column" id="words-column"></div>
    </div>

    <button class="btn-check" onclick="checkAnswers()">Check Answer 🎯</button>
    <canvas id="fireworks-canvas"></canvas>

    <script>
        // 英文版職業資料
        const jobsData = [
            { id: 'nurse', name: 'Nurse', imgSrc: 'nurse.png', color: '#ffb8b8' },
            { id: 'police', name: 'Police', imgSrc: 'police.png', color: '#a29bfe' },
            { id: 'doctor', name: 'Doctor', imgSrc: 'doctor.png', color: '#74b9ff' },
            { id: 'postman', name: 'Postman', imgSrc: 'postman.png', color: '#ffeaa7' },
            { id: 'chef', name: 'Chef', imgSrc: 'chef.png', color: '#fab1a0' }
        ];

        let selectedImage = null;
        let selectedWord = null;
        let connections = {}; 

        const lineCanvas = document.getElementById('line-canvas');
        const ctx = lineCanvas.getContext('2d');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 語音鼓勵（支援廣東話或英文提示）
        function speakEncouragement() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const phrases = [
                    "唔緊要，再試一次！",
                    "Try again, you can do it!",
                    "加油呀，再諗一諗！",
                    "Good try, let's check again!"
                ];
                const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                
                const utterance = new SpeechSynthesisUtterance(randomPhrase);
                utterance.lang = randomPhrase.includes('!') && !randomPhrase.includes('唔') ? 'en-US' : 'zh-HK';
                utterance.rate = 1.0;
                utterance.pitch = 1.2;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'connect') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                const fanfare = [
                    { f: 523.25, t: 0.0, d: 0.15 }, 
                    { f: 659.25, t: 0.15, d: 0.15 }, 
                    { f: 783.99, t: 0.3, d: 0.15 }, 
                    { f: 1046.50, t: 0.45, d: 0.3 }, 
                    { f: 783.99, t: 0.75, d: 0.15 }, 
                    { f: 1046.50, t: 0.9, d: 0.5 }   
                ];

                fanfare.forEach(note => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.type = 'triangle';
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    
                    noteOsc.frequency.setValueAtTime(note.f, audioCtx.currentTime + note.t);
                    noteGain.gain.setValueAtTime(0.35, audioCtx.currentTime + note.t);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.t + note.d);
                    
                    noteOsc.start(audioCtx.currentTime + note.t);
                    noteOsc.stop(audioCtx.currentTime + note.t + note.d);
                });
            }
        }

        function initGame() {
            const imgCol = document.getElementById('images-column');
            const wordCol = document.getElementById('words-column');

            imgCol.innerHTML = '';
            wordCol.innerHTML = '';

            const shuffledImages = [...jobsData].sort(() => Math.random() - 0.5);
            const shuffledWords = [...jobsData].sort(() => Math.random() - 0.5);

            shuffledImages.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = item.id;
                card.innerHTML = `
                    <div class="avatar-img-container" style="background:${item.color}22">
                        <img src="${item.imgSrc}" alt="${item.name}">
                    </div>
                `;
                card.onclick = () => selectCard(card, 'image');
                imgCol.appendChild(card);
            });

            shuffledWords.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card word-card';
                card.dataset.id = item.id;
                card.textContent = item.name;
                card.onclick = () => selectCard(card, 'word');
                wordCol.appendChild(card);
            });

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            lineCanvas.width = container.clientWidth;
            lineCanvas.height = container.clientHeight;
            updateWordColors();
            drawLines();
        }

        function updateWordColors() {
            const allWords = document.querySelectorAll('#words-column .card');
            allWords.forEach(c => {
                c.classList.remove('connected-word');
                c.style.color = '#222f3e';
            });

            Object.values(connections).forEach(wordId => {
                const targetWordEl = document.querySelector(`#words-column .card[data-id="${wordId}"]`);
                if (targetWordEl) {
                    targetWordEl.classList.add('connected-word');
                    targetWordEl.style.color = '#0984e3';
                }
            });
        }

        function selectCard(card, type) {
            playSound('select');

            if (type === 'image') {
                if (selectedImage) selectedImage.classList.remove('selected');
                selectedImage = card;
                card.classList.add('selected');
            } else {
                if (selectedWord) selectedWord.classList.remove('selected');
                selectedWord = card;
                card.classList.add('selected');
            }

            if (selectedImage && selectedWord) {
                const imgId = selectedImage.dataset.id;
                const wordId = selectedWord.dataset.id;

                connections[imgId] = wordId;

                playSound('connect');

                selectedImage.classList.remove('selected');
                selectedWord.classList.remove('selected');
                selectedImage = null;
                selectedWord = null;

                updateWordColors();
                drawLines();
            }
        }

        function drawLines() {
            ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
            const containerRect = document.querySelector('.game-container').getBoundingClientRect();

            Object.keys(connections).forEach(imgId => {
                const wordId = connections[imgId];
                const imgEl = document.querySelector(`#images-column .card[data-id="${imgId}"]`);
                const wordEl = document.querySelector(`#words-column .card[data-id="${wordId}"]`);

                if (imgEl && wordEl) {
                    const r1 = imgEl.getBoundingClientRect();
                    const r2 = wordEl.getBoundingClientRect();

                    const x1 = r1.right - containerRect.left;
                    const y1 = r1.top + r1.height / 2 - containerRect.top;
                    const x2 = r2.left - containerRect.left;
                    const y2 = r2.top + r2.height / 2 - containerRect.top;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.bezierCurveTo(x1 + 50, y1, x2 - 50, y2, x2, y2);
                    ctx.strokeStyle = '#ff9f43';
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            });
        }

        function checkAnswers() {
            const total = jobsData.length;
            const connectedCount = Object.keys(connections).length;

            if (connectedCount < total) {
                speakEncouragement();
                shakeContainer();
                alert('Please connect all items before checking!');
                return;
            }

            let correctCount = 0;
            Object.keys(connections).forEach(imgId => {
                if (connections[imgId] === imgId) {
                    correctCount++;
                }
            });

            if (correctCount === total) {
                playSound('win');
                launchFireworks();
            } else {
                speakEncouragement();
                shakeContainer();
                alert(`You got ${correctCount} correct. Keep trying!`);
            }
        }

        function shakeContainer() {
            const container = document.querySelector('.game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 400);
        }

        function launchFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const fwCtx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#e84393', '#70a1ff', '#ff6b81', '#7bed9f'];

            function createFirework(x, y) {
                for (let i = 0; i < 80; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 9 + 2;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1,
                        size: Math.random() * 6 + 2
                    });
                }
            }

            createFirework(canvas.width * 0.3, canvas.height * 0.4);
            setTimeout(() => createFirework(canvas.width * 0.7, canvas.height * 0.3), 150);
            setTimeout(() => createFirework(canvas.width * 0.5, canvas.height * 0.5), 300);
            setTimeout(() => createFirework(canvas.width * 0.2, canvas.height * 0.6), 450);
            setTimeout(() => createFirework(canvas.width * 0.8, canvas.height * 0.5), 600);

            function animate() {
                fwCtx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.alpha -= 0.012;

                    fwCtx.globalAlpha = Math.max(0, p.alpha);
                    fwCtx.fillStyle = p.color;
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    fwCtx.fill();

                    if (p.alpha <= 0) particles.splice(index, 1);
                });

                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        window.onload = initGame;
    </script>
</body>
</html>
